<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eee9f3" />
  <meta name="description" content="Four pages of meows. One very opinionated cat. Miri’s personal soundboard." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Miri — a little sound machine</title>
  <script>try{let t=localStorage.getItem('miri-theme')||'system';document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}catch{}</script>
</head>
<body>
  <div id="app">
    <main>
      <div class="stage">
        <section class="device" aria-label="Miri soundboard">
          <i class="screw screw-tl"></i><i class="screw screw-tr"></i><i class="screw screw-bl"></i><i class="screw screw-br"></i>
          <div class="device-header"><div class="device-brand"><svg class="device-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5l5 4h6l5-4v14H4Z"/><path d="M8 13h1m6 0h1m-5 3h2"/></svg><div>miri<span>sound machine</span></div></div><div class="power"><span></span> READY</div></div>
          <div class="page-controls"><span id="page-label">FRESH MEOWS</span><div class="page-navigation" role="group" aria-label="Sound pages"><button class="page-arrow" id="page-previous" aria-label="Previous sound page" title="Previous sound page"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m8 2-4 4 4 4"/></svg></button><span class="page-lcd" role="status" aria-label="Page 1 of 4">01 / 04</span><button class="page-arrow" id="page-next" aria-label="Next sound page" title="Next sound page"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="m4 2 4 4-4 4"/></svg></button></div></div>
          <div class="pads" aria-label="Page 1 sound buttons"></div>
          <div class="device-controls"><button id="stop" aria-label="Stop all sounds"><span class="stop-icon"></span> STOP</button><div class="volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3V9Zm13-2c3 3 3 7 0 10"/></svg><input type="range" id="volume" min="0" max="100" value="75" aria-label="Volume"/><output for="volume">75</output></div></div>
          <div class="device-bottom"><div class="speaker" aria-hidden="true"></div><div class="theme-switch" role="group" aria-label="Appearance"><span class="switch-thumb" aria-hidden="true"></span><button data-theme="light" aria-label="Light mode" title="Light mode">Light</button><button data-theme="system" aria-label="Follow system" title="Follow system">Auto</button><button data-theme="dark" aria-label="Dark mode" title="Dark mode">Dark</button></div><span>STEREO / MEOW</span></div>
        </section>
      </div>
      <p id="status" class="sr-only" role="status" aria-live="polite">Miri’s recordings are being prepared.</p>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
